<!-- Leaflet — harta principală a fost scoasă de pe index.html, dar biblioteca
     rămâne necesară pentru mini-harta de localizare din wizard-ul "Adaugă
     baltă" (abMap, în modalul #ab-modal, pas 2). -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── TEMĂ AUTOMATĂ (LIGHT/DARK) ───────────────────────────────────────────────
// Fără GPS, fără date personale — coordonată fixă de referință (centrul
// României); diferența de răsărit/apus în interiorul țării e sub 30 min,
// nesemnificativă pentru un simplu switch de temă. Zero implicații GDPR.
var ZC_LAT = 45.9432, ZC_LNG = 24.9668;
var ZC_TEMA_KEY = 'zoda-tema'; // localStorage: 'light' | 'dark' | 'auto' (implicit)

function _zcSunTimesUTC(date, lat, lng) {
  // Algoritm uzual de calcul răsărit/apus (ecuația Soarelui, precizie de
  // câteva minute — suficientă pentru un switch de temă).
  var rad = Math.PI / 180;
  var start = Date.UTC(date.getUTCFullYear(), 0, 1);
  var dayOfYear = Math.floor((Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - start) / 86400000) + 1;
  var lngHour = lng / 15;
  function calc(isRise) {
    var t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    var M = 0.9856 * t - 3.289;
    var L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = (L + 360) % 360;
    var RA = (1 / rad) * Math.atan(0.91764 * Math.tan(L * rad));
    RA = (RA + 360) % 360;
    var Lq = Math.floor(L / 90) * 90, RAq = Math.floor(RA / 90) * 90;
    RA = (RA + (Lq - RAq)) / 15;
    var sinDec = 0.39782 * Math.sin(L * rad);
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(90.833 * rad) - (sinDec * Math.sin(lat * rad))) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    var H = (isRise ? 360 - (1 / rad) * Math.acos(cosH) : (1 / rad) * Math.acos(cosH)) / 15;
    var T = H + RA - 0.06571 * t - 6.622;
    return (T - lngHour + 24) % 24; // ore UTC, zecimal
  }
  return { sunrise: calc(true), sunset: calc(false) };
}
function _zcEsteZi() {
  var now = new Date();
  var t = _zcSunTimesUTC(now, ZC_LAT, ZC_LNG);
  if (t.sunrise == null || t.sunset == null) return true;
  var h = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
  return h >= t.sunrise && h < t.sunset;
}
function _zcTemaSalvata() {
  try { return localStorage.getItem(ZC_TEMA_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function _zcTemaEfectiva() {
  var pref = _zcTemaSalvata();
  if (pref === 'light' || pref === 'dark') return pref;
  return _zcEsteZi() ? 'light' : 'dark';
}
function _zcAplicaTema(gradual) {
  var tema = _zcTemaEfectiva();
  var root = document.documentElement;
  var curent = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  if (curent === tema) return;
  if (gradual) {
    root.classList.add('theme-transitioning');
    setTimeout(function () { root.classList.remove('theme-transitioning'); }, 4000);
  }
  if (tema === 'light') root.setAttribute('data-theme', 'light');
  else root.removeAttribute('data-theme');
}
// Apelată din selectorul "Temă" din Cont — schimbare INSTANTĂ (fără gradual)
function setZodaTema(pref) {
  try { localStorage.setItem(ZC_TEMA_KEY, pref); } catch (e) {}
  _zcAplicaTema(false);
}
// Aplicare instant la încărcare (înaintea primului paint, fără "flash" greșit)
_zcAplicaTema(false);
// Reverificare periodică — doar în modul automat prinde momentul exact al
// răsăritului/apusului, cu tranziție graduală (3-5s)
setInterval(function () { if (_zcTemaSalvata() === 'auto') _zcAplicaTema(true); }, 5 * 60 * 1000);
</script>

<style>
:root{
  /* Paletă DARK (implicită) — valorile originale ale platformei */
  --zc-bg:#0a0f1a;
  --zc-bg-panel:#111827;
  --zc-border:#1e293b;
  --zc-text-dim:#4d5d78;
  --zc-text-muted:#64748f;
  --zc-text-secondary:#64748b;
  --zc-text-secondary-2:#94a3b8;
  --zc-text-strong:#e2e8f0;
  --zc-text-primary:#f1f5f9;
  --zc-bg-tint:#0c3a4d;
  --zc-bg-deep:#071c26;
  --zc-accent-dark:#0e7490;
  --zc-hdr-bg:rgba(10,15,26,.97);
  --zc-cta-1:#0c3a4d;
  --zc-cta-2:#0e7490;
}
html[data-theme="light"]{
  /* Paletă LIGHT — pentru citire în lumină puternică (soare) */
  --zc-bg:#f4f7fb;
  --zc-bg-panel:#ffffff;
  --zc-border:#dde4ec;
  --zc-text-dim:#6b7a90;
  --zc-text-muted:#64748b;
  --zc-text-secondary:#475569;
  --zc-text-secondary-2:#64748b;
  --zc-text-strong:#1e293b;
  --zc-text-primary:#0f172a;
  --zc-bg-tint:#e0f2fe;
  --zc-bg-deep:#f0f9ff;
  --zc-accent-dark:#0891b2;
  --zc-hdr-bg:rgba(244,247,251,.92);
}
/* Tranziție graduală — activată DOAR de motorul de temă automată (nu la
   schimbarea manuală din Cont, care rămâne instantă) */
html.theme-transitioning,
html.theme-transitioning *{
  transition:background-color .8s ease,border-color .8s ease,color .8s ease,fill .8s ease,stroke .8s ease !important;
}

/* ============================================================
   RESET & BAZĂ COMUNĂ
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background-color:var(--zc-bg);color:var(--zc-text-primary);font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;min-height:100vh;isolation:isolate;overflow-x:hidden;max-width:100vw;}

/* ============================================================
   SCALA DE Z-INDEX — sursă unică de adevăr pentru tot ce se
   suprapune pe pagină. Orice element nou care plutește peste
   conținut trebuie să folosească UNA din variabilele de mai jos,
   nu un număr inventat pe loc — asta e exact ce a cauzat bug-urile
   repetate de "X apare peste Y" din trecut.

   Ordinea, de la fundal la prim-plan:
     1. --z-map            [nefolosit — harta Leaflet a fost scoasă de pe
                            index.html; variabila a rămas definită, dar nimic
                            n-o mai citește]
     2. --z-dropdown       orice listă/sugestie care apare peste conținutul
                            paginii (căutare bălți, căutare pescari, bălți
                            verificate, dropdown de județ etc.)
     3. --z-header         header-ul sticky, trebuie mereu deasupra
                            conținutului paginii la scroll
     4. --z-notif-panel    panoul de notificări, se deschide DIN header,
                            deci trebuie să fie peste el
     5. --z-bottom-bar     barele fixate jos (cookie, promo)
     6. --z-toast          mesaje temporare (guest toast, PWA install)
     7. --z-modal           orice fereastră modală full-screen
     8. --z-save-toast      confirmarea de salvare — mereu deasupra a
                            absolut orice altceva, inclusiv modale deschise

   EXCEPȚIE: #bottom-nav (meniul de jos) primește un z-index propriu, PESTE
   --z-modal (nu variabila --z-bottom-bar, care rămâne pentru cookie-notice/
   promo-bar) — user-ul trebuie să poată naviga din meniul de jos chiar și cu
   un modal Capturi/Clasament deschis peste el (modalurile alea ocupă acum tot
   ecranul pe mobil, dar meniul plutește deasupra, rămânând activ).

   IMPORTANT: elementele-ancoră ale unui dropdown (ex. #search-wrap,
   .stat-chip-clickable) NU trebuie să aibă ele însele z-index — dacă au,
   creează un "context de stivuire" izolat propriu, iar dropdown-ul lor
   copil nu se mai poate compara corect cu alte elemente de pe pagină
   (exact bug-ul din 29 iulie 2026). Doar dropdown-ul propriu-zis
   primește z-index, direct din --z-dropdown.
   ============================================================ */
:root{
  --z-map: 0;
  --z-dropdown: 50;
  --z-header: 200;
  --z-notif-panel: 250;
  --z-bottom-bar: 300;
  --z-toast: 350;
  --z-modal: 400;
  --z-save-toast: 500;
}

#hdr-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:52px;gap:8px;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-img{height:32px;width:auto;display:block;}
.logo-img-light{display:none;}

.logo-icon{font-size:25px;}
.logo-text{font-size:20px;font-weight:900;color:#38bdf8;letter-spacing:-.5px;}
nav{display:flex;align-items:center;gap:6px;}
.nav-btn{background:transparent;border:none;color:var(--zc-text-secondary-2);cursor:pointer;border-radius:8px;transition:color .2s;font-size:13px;padding:6px 8px;}
.nav-btn:hover{color:var(--zc-text-primary);}
.nav-primary{background:var(--zc-bg-tint);border:none;color:#38bdf8;font-weight:700;cursor:pointer;border-radius:8px;font-size:13px;padding:6px 10px;}
.nav-primary:hover{background:#0891b2;}
/* Mobil: ascunde textul din butoane, afișează doar iconița */
.nav-label{display:inline;}
.nav-user{display:flex;align-items:center;gap:8px;}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:var(--zc-bg-tint);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#38bdf8;cursor:pointer;border:2px solid var(--zc-accent-dark);}
.nav-user-name{display:none;font-size:15px;color:var(--zc-text-secondary-2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-logout{background:transparent;border:1px solid var(--zc-border);color:var(--zc-text-muted);font-size:13px;padding:5px 10px;border-radius:7px;cursor:pointer;}
.nav-logout:hover{border-color:#ef4444;color:#ef4444;}
.nav-admin-badge{font-size:11px;background:#f59e0b;color:#000;padding:2px 7px;border-radius:4px;font-weight:800;}
.nav-bell{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:8px;cursor:pointer;color:var(--zc-text-secondary-2);font-size:18px;transition:border-color .2s,color .2s;flex-shrink:0;}
.nav-bell:hover{border-color:#38bdf8;color:#38bdf8;}
.nav-bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;background:#ef4444;border-radius:9px;font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--zc-bg);line-height:1;pointer-events:none;}
/* Panel notificări */
#notif-panel{position:fixed;top:56px;right:12px;width:340px;max-height:480px;background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:var(--z-notif-panel);display:none;flex-direction:column;overflow:hidden;}

.notif-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--zc-border);flex-shrink:0;}
.notif-hdr-title{font-size:15px;font-weight:800;color:var(--zc-text-primary);}
.notif-mark-all{font-size:12px;color:var(--zc-text-muted);cursor:pointer;transition:color .2s;}
.notif-mark-all:hover{color:#38bdf8;}
.notif-list{overflow-y:auto;flex:1;}

.notif-item:hover{background:var(--zc-border);}

#hero{max-width:1400px;margin:0 auto;text-align:center;padding:60px 14px 20px;}
.hero-title{font-weight:900;line-height:1.15;color:#f8fafc;margin-bottom:14px;font-size:38px;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;}
.hero-sub{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 16px;max-width:460px;margin:0 auto 10px;font-size:12.9px;font-weight:700;color:#f8fafc;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 6px rgba(0,0,0,.6);}

#main > *{min-width:0;}
/* Generice pentru orice hartă Leaflet de pe pagină — folosite acum doar de
   abMap (mini-harta din wizard-ul "Adaugă baltă"), harta principală a fost
   scoasă complet. */
.leaflet-control{z-index:400!important;}
.leaflet-top,.leaflet-bottom{z-index:400!important;}

/* CAPTURI RECENTE — înlocuiește harta Leaflet */
#cr-wrap{margin:0 10px;min-width:0;}
#cr-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
#cr-title{font-size:19px;font-weight:900;color:var(--zc-text-primary);}
#cr-vezi-tot{background:none;border:none;color:#38bdf8;font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 6px;}
#cr-carousel{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
#cr-track{display:flex;gap:10px;}
.cr-card{flex:0 0 82%;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:var(--zc-bg-panel);border:1px solid var(--zc-border);box-shadow:0 14px 34px -14px rgba(0,0,0,.55);display:flex;flex-direction:column;min-width:0;}
.cr-photo{width:100%;aspect-ratio:4/3;background-size:cover;background-position:center;background-color:var(--zc-bg);position:relative;}
.cr-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, transparent 55%, rgba(8,14,20,.92) 100%);}
.cr-info{padding:10px 12px 12px;}
.cr-row1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.cr-kg{font-size:17px;font-weight:900;color:#38bdf8;font-family:inherit;white-space:nowrap;}
.cr-stand{font-size:11.5px;color:var(--zc-text-muted);font-weight:600;white-space:nowrap;}
.cr-loc{font-size:12px;color:var(--zc-text-secondary);font-weight:500;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-pescar{display:flex;align-items:center;gap:7px;margin-top:7px;padding-top:7px;border-top:1px solid var(--zc-border);}
.cr-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--zc-border);}
.cr-pescar-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;}
.cr-pescar-name{font-size:12.5px;font-weight:600;color:#38bdf8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;line-height:1.35;}
.cr-time{font-size:11px;color:var(--zc-text-dim);line-height:1.35;}
@media(min-width:600px){ .cr-card{flex:0 0 calc(33.333% - 7px);} }
.cr-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;}
.cr-grid .cr-photo{aspect-ratio:1/1;}
.cr-grid .cr-card{flex:none;}

.balta-tooltip::before{border-top-color:var(--zc-border)!important;}

/* GUEST TOAST */
#guest-toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:var(--z-toast);background:var(--zc-bg-panel);border:1px solid var(--zc-bg-tint);border-radius:14px;padding:14px 18px 14px 16px;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);transition:bottom .2s,transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s;max-width:calc(100vw - 32px);width:max-content;opacity:0;}
#guest-toast.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
.gt-icon{font-size:25px;flex-shrink:0;}
.gt-text{flex:1;min-width:0;}
.gt-title{font-size:15px;font-weight:800;color:var(--zc-text-primary);margin-bottom:2px;}
.gt-sub{font-size:12px;color:var(--zc-text-secondary);line-height:1.4;}
.gt-btn{background:var(--zc-bg-tint);border:none;color:#38bdf8;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s;}
.gt-btn:hover{background:#0891b2;}
.gt-close{background:transparent;border:none;color:var(--zc-text-dim);font-size:20px;cursor:pointer;line-height:1;padding:0 0 0 4px;flex-shrink:0;transition:color .2s;}
.gt-close:hover{color:var(--zc-text-secondary-2);}
#pwa-install-toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:var(--z-toast);background:var(--zc-bg-panel);border:1px solid var(--zc-bg-tint);border-radius:14px;padding:14px 18px 14px 16px;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);transition:bottom .2s,transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s;max-width:calc(100vw - 32px);width:max-content;opacity:0;}
#pwa-install-toast.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
#pwa-ios-toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:var(--z-toast);background:var(--zc-bg-panel);border:1px solid var(--zc-bg-tint);border-radius:14px;padding:14px 18px 14px 16px;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);transition:bottom .2s,transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s;max-width:calc(100vw - 32px);width:max-content;opacity:0;}
#pwa-ios-toast.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
/* PESCAR GUEST MODAL */
#pescar-guest-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:var(--z-modal);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
#pescar-guest-modal.open{display:flex;}
.pgm-box{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:20px;padding:32px 28px;max-width:360px;width:100%;text-align:center;position:relative;}
.pgm-icon{font-size:45px;margin-bottom:12px;}
.pgm-title{font-size:19px;font-weight:900;color:var(--zc-text-primary);margin-bottom:8px;}
.pgm-sub{font-size:15px;color:var(--zc-text-secondary);line-height:1.6;margin-bottom:20px;}
.pgm-btn{width:100%;background:var(--zc-bg-tint);border:none;color:#38bdf8;font-size:16px;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;transition:background .2s;margin-bottom:10px;}
.pgm-btn:hover{background:#0891b2;}
.pgm-close{background:transparent;border:none;color:var(--zc-text-muted);font-size:15px;cursor:pointer;transition:color .2s;}
.pgm-close:hover{color:var(--zc-text-secondary-2);}
#sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.hof-card,.balti-card{min-width:0;}
.hof-card{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:14px;overflow:hidden;}
.hof-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--zc-border);padding:10px 12px;}
.hof-header-text{flex:1;min-width:0;text-align:center;}
.hof-title{font-weight:800;color:#f59e0b;display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;white-space:nowrap;}
.hof-sub{font-size:13px;color:var(--zc-text-secondary);margin-top:1px;text-align:center;}
.hof-row{display:flex;align-items:center;border-bottom:1px solid var(--zc-border);gap:7px;padding:7px 10px;}
.hof-row:last-child{border-bottom:none;}
.hof-loc{display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;width:18px;font-size:11px;color:var(--zc-text-muted);}
.hof-avatar{width:32px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--zc-border);}
.hof-avatar-empty{width:32px;height:32px;border-radius:4px;flex-shrink:0;background:var(--zc-border);}
.hof-name{font-weight:700;color:var(--zc-text-strong);font-size:12px;}
.hof-detail{color:var(--zc-text-muted);margin-top:1px;font-size:10px;}
.hof-stars{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0;}
.star{color:#f59e0b;font-size:12px;}
.hof-count{font-size:15px;color:#f59e0b;font-weight:800;}
.hof-star-legend{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.hof-star-legend-label{font-size:10px;color:var(--zc-text-muted);font-weight:600;letter-spacing:.04em;white-space:nowrap;}
.see-all:hover{color:#38bdf8;}

/* PODIUM — top 3 din Hall of Fame (în modalul Clasament, tab All-time), în
   locul celor 3 rânduri simple .hof-row. Restul clasamentului (loc 4+)
   continuă mai jos cu .hof-row, neschimbat. */
.hof-podium{display:flex;align-items:flex-end;gap:8px;padding:74px 12px 4px;}
.hof-pod-item{flex:1;min-width:0;background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:14px;padding:0 6px 14px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;}
.hof-pod-1{border-color:#38bdf8;box-shadow:0 0 26px rgba(56,189,248,.28);z-index:1;}
.hof-pod-avatar-wrap{width:60px;height:60px;border-radius:50%;margin-top:-26px;overflow:hidden;border:2px solid var(--zc-border);background:var(--zc-bg);flex-shrink:0;}
.hof-pod-1 .hof-pod-avatar-wrap{width:84px;height:84px;margin-top:-42px;border:3px solid #38bdf8;box-shadow:0 0 20px rgba(56,189,248,.65);}
.hof-pod-avatar{width:100%;height:100%;object-fit:cover;display:block;}
.hof-pod-avatar-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--zc-text-dim);background:var(--zc-bg);}
.hof-pod-crown{position:absolute;top:-64px;left:50%;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 0 7px rgba(56,189,248,.75));}
.hof-pod-rank{width:24px;height:24px;border-radius:50%;background:var(--zc-bg);border:1.5px solid var(--zc-text-dim);color:var(--zc-text-secondary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:-12px;z-index:2;}
.hof-pod-1 .hof-pod-rank{border-color:#38bdf8;color:#38bdf8;}
.hof-pod-name{font-size:13px;font-weight:800;color:var(--zc-text-primary);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.hof-pod-stat{font-size:11px;color:var(--zc-text-secondary);margin-top:2px;}

.balti-card{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:14px;overflow:hidden;}
#saptamanal-wrap{display:grid;grid-template-columns:1fr;gap:10px;margin:0 10px;}
.balti-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--zc-border);padding:10px 12px;}
.balti-title{font-weight:800;color:var(--zc-text-strong);font-size:16px;flex:1;min-width:0;text-align:center;}
.balti-count{background:var(--zc-bg-tint);color:#38bdf8;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;}
.balta-row{display:flex;align-items:center;border-bottom:1px solid var(--zc-border);cursor:pointer;transition:background .15s;gap:7px;padding:8px 10px;}
.balta-row:last-child{border-bottom:none;}
.balta-row:hover{background:var(--zc-border);}
.balta-emoji{background:var(--zc-bg-deep);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px;font-size:16px;}
.balta-name{font-weight:700;color:var(--zc-text-primary);font-size:12px;}
.balta-meta{color:var(--zc-text-secondary);margin-top:2px;font-size:10px;}
.balta-price{font-size:12px;font-weight:700;color:#38bdf8;margin-left:auto;flex-shrink:0;}
.balta-arrow{color:var(--zc-text-dim);font-size:18px;margin-left:4px;}
#hof-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:var(--z-modal);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;}
#hof-modal.open{display:flex;}
#capturi-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:var(--z-modal);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;}
#capturi-modal.open{display:flex;}
#capturi-recente-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:var(--z-modal);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;}
#capturi-recente-modal.open{display:flex;}
.hof-modal-inner{background:var(--zc-bg);border:1px solid var(--zc-border);overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:100%;
  /* mobil: modalul ocupă tot ecranul, nu doar 80vh cu colțuri rotunjite jos —
     meniul de jos rămâne vizibil/activ deasupra lui (vezi #bottom-nav) */
  height:100dvh;max-height:100dvh;border-radius:0;}
.hof-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--zc-border);}
.hof-modal-title{font-size:22px;font-weight:900;color:#f59e0b;}
.hof-modal-sub{font-size:13px;color:var(--zc-text-muted);margin-top:3px;}
.modal-close{background:transparent;border:none;color:var(--zc-text-muted);font-size:25px;cursor:pointer;}
.hof-modal-list{overflow-y:auto;
  /* mobil: spațiu jos ca ultimele rânduri să nu fie ascunse sub #bottom-nav,
     care plutește deasupra modalului full-page (vezi z-index-ul lui) */
  padding:8px 0 calc(84px + env(safe-area-inset-bottom));}
.hof-modal-list.cr-grid{padding:14px 14px calc(84px + env(safe-area-inset-bottom));}
.lb-tab-toggle{display:flex;gap:6px;padding:12px 24px 0;}
.lb-tab-btn{flex:1;background:var(--zc-bg);border:1px solid var(--zc-border);border-radius:10px;padding:9px;font-size:13.5px;font-weight:700;color:var(--zc-text-secondary);cursor:pointer;}
.lb-tab-btn.active{background:#38bdf8;border-color:#38bdf8;color:var(--zc-bg);}
.judet-opt{padding:9px 14px;cursor:pointer;font-size:15px;color:var(--zc-text-primary);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--zc-border);transition:background .1s;}
.judet-opt:last-child{border-bottom:none;}
.judet-opt:hover,.judet-opt.focused{background:var(--zc-border);}
.judet-opt.match-first{background:var(--zc-bg-deep);}
.judet-opt .judet-match{color:#38bdf8;font-weight:800;}
#auth-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:var(--z-modal);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;}
#auth-modal.open{display:flex;}
.auth-inner{background:var(--zc-bg);border:1px solid var(--zc-border);width:100%;position:relative;max-width:100%;border-radius:16px 16px 0 0;padding:24px 18px;margin-top:auto;margin-bottom:calc(70px + env(safe-area-inset-bottom));}
.auth-close{position:absolute;top:16px;right:18px;background:transparent;border:none;color:var(--zc-text-muted);font-size:25px;cursor:pointer;}
.auth-logo{text-align:center;font-size:36px;margin-bottom:8px;}
.auth-title{text-align:center;font-size:22px;font-weight:900;color:var(--zc-text-primary);margin-bottom:4px;}
.auth-sub{text-align:center;font-size:13px;color:var(--zc-text-muted);margin-bottom:24px;}
.auth-tabs{display:flex;background:var(--zc-bg-panel);border-radius:10px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;background:transparent;border:none;color:var(--zc-text-muted);font-size:15px;font-weight:600;padding:8px;border-radius:7px;cursor:pointer;transition:all .2s;}
.auth-tab.active{background:var(--zc-bg-tint);color:#38bdf8;}
.auth-fg{margin-bottom:14px;}
.auth-fg label{display:block;font-size:12px;font-weight:700;color:var(--zc-text-muted);letter-spacing:.06em;margin-bottom:5px;}
.auth-fg input{width:100%;background:var(--zc-bg-panel);border:1.5px solid var(--zc-border);border-radius:8px;padding:10px 12px;color:var(--zc-text-primary);font-size:16px;outline:none;transition:border-color .2s;}
.auth-fg input:focus{border-color:var(--zc-bg-tint);}
.auth-btn{width:100%;background:var(--zc-bg-tint);border:none;color:#38bdf8;font-size:16px;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;margin-top:6px;transition:background .2s;}
.auth-btn:hover{background:#0891b2;}
.auth-btn:disabled{opacity:.5;cursor:not-allowed;}
.auth-err{background:#3b0f0f;border:1px solid #ef4444;border-radius:8px;padding:9px 12px;font-size:13px;color:#fca5a5;margin-bottom:12px;display:none;}
.auth-ok{background:var(--zc-bg-deep);border:1px solid var(--zc-bg-tint);border-radius:8px;padding:9px 12px;font-size:13px;color:#38bdf8;margin-bottom:12px;display:none;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--zc-text-dim);font-size:12px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--zc-border);}
.auth-google{width:100%;background:var(--zc-bg-panel);border:1.5px solid var(--zc-border);color:var(--zc-text-primary);font-size:15px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .2s;-webkit-tap-highlight-color:transparent;}
.auth-google:hover{border-color:var(--zc-text-dim);}
.auth-google svg{pointer-events:none;flex-shrink:0;}
.auth-remember{display:flex;align-items:center;gap:8px;margin:10px 0 14px 0;}
.auth-remember input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--zc-bg-tint);flex-shrink:0;}
.auth-remember label{font-size:13px;color:var(--zc-text-secondary);cursor:pointer;user-select:none;}
#edit-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:var(--z-modal);backdrop-filter:blur(6px);overflow-y:auto;align-items:flex-end;justify-content:center;padding:0;}
#edit-modal.open{display:flex;}
.edit-inner{background:var(--zc-bg);border:1px solid var(--zc-border);width:100%;margin:0 auto;max-width:100%;border-radius:16px 16px 0 0;margin-top:auto;}
.edit-hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--zc-border);position:sticky;top:0;background:var(--zc-bg);z-index:10;border-radius:16px 16px 0 0;padding:14px 16px;}
.edit-title{font-weight:800;color:var(--zc-text-primary);font-size:16px;}
.edit-hdr-btns{display:flex;gap:8px;align-items:center;}
.edit-save-btn{background:var(--zc-bg-tint);border:none;color:#38bdf8;font-weight:700;cursor:pointer;border-radius:8px;font-size:13px;padding:7px 12px;}
.edit-save-btn:hover{background:#0891b2;}
.edit-close{background:transparent;border:none;color:var(--zc-text-muted);font-size:25px;cursor:pointer;line-height:1;}
.edit-body{padding:16px;}
.edit-section{margin-bottom:28px;}
.edit-section-title{font-size:12px;font-weight:800;color:var(--zc-text-muted);letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--zc-border);display:flex;align-items:center;gap:8px;}
.edit-section-title span{flex:1;}
.se-card{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;}
.se-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;}
.se-nr-badge{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--zc-cta-1),var(--zc-cta-2));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;flex-shrink:0;}
.se-card-name{font-weight:700;font-size:15px;color:var(--zc-text-strong);flex:1;}
.se-card-toggle{color:var(--zc-text-muted);font-size:16px;transition:transform .2s;}
.se-card-body{display:none;}
.se-card-body.open{display:block;}
.se-del-btn{background:transparent;border:1px solid var(--zc-text-dim);color:var(--zc-text-secondary);font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer;}
.se-del-btn:hover{border-color:#ef4444;color:#ef4444;}
.gal-edit-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.gal-thumb-edit{position:relative;width:72px;height:72px;border-radius:7px;overflow:hidden;border:1px solid var(--zc-border);flex-shrink:0;}
.gal-thumb-edit img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-thumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#ef4444;font-size:16px;width:18px;height:18px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.gal-add-btn{width:72px;height:72px;border:1.5px dashed var(--zc-border);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;color:var(--zc-text-muted);font-size:11px;transition:all .15s;}
.gal-add-btn:hover{border-color:var(--zc-bg-tint);color:#38bdf8;}
.save-toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,var(--zc-cta-1),var(--zc-cta-2));color:#fff;font-weight:700;font-size:15px;padding:12px 20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:var(--z-save-toast);opacity:0;pointer-events:none;transform:translateY(10px);transition:all .3s;}
.save-toast.show{pointer-events:auto;opacity:1;transform:translateY(0);}
#ab-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:var(--z-modal);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;}
#ab-modal.open{display:flex;}
.ab-inner{background:var(--zc-bg);border:1px solid var(--zc-border);width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;max-width:100%;border-radius:16px 16px 0 0;margin-top:auto;}
.ab-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--zc-border);flex-shrink:0;}
.ab-title{font-size:20px;font-weight:900;color:var(--zc-text-primary);}
.ab-close{background:transparent;border:none;color:var(--zc-text-muted);font-size:25px;cursor:pointer;}
.ab-steps{display:flex;padding:16px 24px;border-bottom:1px solid var(--zc-border);flex-shrink:0;}
.ab-step{display:flex;align-items:center;gap:8px;flex:1;}
.ab-step:not(:last-child)::after{content:'';flex:1;height:2px;background:var(--zc-border);margin:0 8px;}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;border:2px solid var(--zc-border);color:var(--zc-text-muted);background:var(--zc-bg);transition:all .25s;}
.step-dot.done{background:var(--zc-bg-tint);border-color:#38bdf8;color:#38bdf8;}
.step-dot.active{background:var(--zc-border);border-color:#38bdf8;color:var(--zc-text-primary);}
.step-lbl{font-size:12px;color:var(--zc-text-muted);font-weight:600;white-space:nowrap;}
.step-lbl.active{color:var(--zc-text-strong);}
.ab-body{overflow-y:auto;padding:20px 24px;flex:1;}
.ab-pane{display:none;}
.ab-pane.active{display:block;}
.ab-footer{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--zc-border);flex-shrink:0;}
.ab-back{background:transparent;border:1.5px solid var(--zc-border);color:var(--zc-text-secondary-2);font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;cursor:pointer;}
.ab-back:hover{border-color:var(--zc-text-dim);color:var(--zc-text-primary);}
.ab-next{background:var(--zc-bg-tint);border:none;color:#38bdf8;font-size:15px;font-weight:700;padding:9px 24px;border-radius:8px;cursor:pointer;}
.ab-next:hover{background:#0891b2;}
.ab-submit{background:linear-gradient(135deg,var(--zc-cta-1),var(--zc-cta-2));border:none;color:#fff;font-size:16px;font-weight:800;padding:10px 28px;border-radius:8px;cursor:pointer;}
.ab-submit:hover{background:linear-gradient(135deg,#0891b2,var(--zc-accent-dark));}
#ab-search-box:focus-within{border-color:var(--zc-bg-tint)!important;}
.step-count{font-size:12px;color:var(--zc-text-muted);}
.ab-success{text-align:center;padding:32px 0;}
.ab-success-icon{font-size:63px;margin-bottom:16px;}
.ab-success-title{font-size:22px;font-weight:800;color:#38bdf8;margin-bottom:8px;}
.ab-success-sub{color:var(--zc-text-secondary);font-size:15px;line-height:1.6;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--zc-text-secondary);letter-spacing:.06em;margin-bottom:6px;}
.fg input,.fg select,.fg textarea{width:100%;background:var(--zc-bg-panel);border:1.5px solid var(--zc-border);border-radius:8px;padding:10px 12px;color:var(--zc-text-primary);font-size:16px;outline:none;transition:border-color .2s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--zc-bg-tint);}
.fg textarea{resize:vertical;min-height:80px;}
.fg select option{background:var(--zc-bg-panel);}
.fg-row{display:grid;grid-template-columns:1fr;gap:12px;}
.fg-row3{display:grid;grid-template-columns:1fr;gap:12px;}
#ab-map{width:100%;height:260px;border-radius:10px;overflow:hidden;border:1.5px solid var(--zc-border);margin-bottom:10px;}
.ab-coord-box{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:13px;color:#38bdf8;display:flex;align-items:center;gap:8px;}
.ab-coord-lbl{color:var(--zc-text-muted);font-size:12px;font-family:inherit;}
.stand-item{background:var(--zc-bg-panel);border:1px solid var(--zc-border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;}
.stand-item-nr{font-size:12px;font-weight:800;color:#38bdf8;letter-spacing:.05em;margin-bottom:10px;}
.stand-del{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--zc-text-muted);font-size:18px;cursor:pointer;}
.stand-del:hover{color:#ef4444;}
.add-stand-btn{width:100%;background:transparent;border:1.5px dashed var(--zc-border);border-radius:10px;padding:14px;color:var(--zc-text-muted);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.add-stand-btn:hover{border-color:var(--zc-bg-tint);color:#38bdf8;background:var(--zc-bg-deep);}

/* ============================================================
   ECRANE FOARTE MICI (320-360px)
   ============================================================ */
@media(max-width:480px){
  #hdr-in{padding:0 6px;gap:3px;}
  .logo-img{height:22px;}
  nav{gap:4px;}
  .nav-btn{padding:5px 6px;font-size:11.8px;}
  .nav-primary{font-size:12.9px;padding:6px 10px;}
  .nav-admin-badge{font-size:10px;padding:2px 5px;}
  .nav-user{gap:5px;}
  .logo-text{font-size:18px;}
  #notif-panel{width:calc(100vw - 24px);right:12px;left:12px;}
  .hero-title{font-size:31px;}
  .hero-sub{font-size:10.6px;gap:6px 12px;}
}
@media(max-width:340px){
  #hdr-in{flex-wrap:wrap;row-gap:6px;}
  nav{flex-wrap:wrap;row-gap:6px;}
}

/* ============================================================
   DESKTOP (min-width: 769px)
   ============================================================ */
@media(min-width:769px){
  #hero-photo,#hero-glow{height:1100px;}
  #hdr-in{padding:0 24px;height:62px;gap:16px;}
  .logo-icon{font-size:31px;}
  .logo-text{font-size:25px;}
  .nav-btn{font-size:16px;padding:8px 14px;}
  .nav-primary{font-size:15px;padding:8px 18px;}
  .nav-user-name{display:block;}
  #hero{padding:96px 24px 36px;}
  .hero-title{font-size:60px;}
  .hero-sub{font-size:16px;max-width:680px;gap:10px 22px;}
  .hero-sub:last-of-type{margin-bottom:36px;}
  #search-wrap{padding:0;}
  #search-input{font-size:17px;}
  #stats-bar{padding:0;}
  .stat-chip{padding:5px 20px;font-size:16px;}
  #main{padding:0 24px 60px;max-width:900px;grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;grid-template-areas:"search" "statsbar" "cautaPescari" "mapwrap" "saptamanal";gap:14px;}
  #cauta-pescari-card{grid-area:cautaPescari;max-width:100%;margin:0 0 10px;}
  #saptamanal-wrap{grid-area:saptamanal;grid-template-columns:1fr 1fr;margin:0;}
  #stats-bar{grid-area:statsbar;}
  #cr-wrap{grid-area:mapwrap;margin:0;}
  #search-wrap{grid-area:search;max-width:100%;margin:0 0 10px;}
  .hof-card,.balti-card{min-width:unset;}
  .hof-header{padding:14px 16px;}
  .hof-title{font-size:19px;}
  .hof-row{gap:10px;padding:9px 14px;}
  .hof-loc{width:26px;height:26px;font-size:13px;}
  .hof-name{font-size:13px;}
  .hof-detail{font-size:11px;}
  .balti-header{padding:14px 16px;}
  .balti-title{font-size:19px;}
  .balta-row{gap:10px;padding:10px 14px;}
  .balta-emoji{width:36px;height:36px;font-size:20px;}
  .balta-name{font-size:15px;}
  .balta-meta{font-size:11px;}
  #hof-modal{align-items:center;justify-content:center;}
  #capturi-modal{align-items:center;justify-content:center;}
  #capturi-recente-modal{align-items:center;justify-content:center;}
  .hof-modal-inner{max-width:560px;height:auto;max-height:85vh;border-radius:20px;margin-top:0;}
  .hof-modal-list{padding-bottom:8px;}
  #auth-modal{align-items:center;justify-content:center;}
  .auth-inner{max-width:420px;border-radius:20px;padding:32px 28px;margin-top:0;margin-bottom:0;}
  #edit-modal{align-items:flex-start;justify-content:center;padding:80px 20px 20px;}
  .edit-inner{max-width:760px;border-radius:20px;margin-top:0;}
  .edit-hdr{border-radius:20px 20px 0 0;padding:20px 24px;}
  .edit-title{font-size:19px;}
  .edit-save-btn{font-size:15px;padding:8px 20px;}
  .edit-body{padding:24px;}
  #ab-modal{align-items:center;justify-content:center;}
  .ab-inner{max-width:680px;border-radius:20px;margin-top:0;}
  .fg-row{grid-template-columns:1fr 1fr;}
  .fg-row3{grid-template-columns:1fr 1fr 1fr;}
}

/* ── FOOTER ────────────────────────────────────────────────────────────── */
#site-footer{border-top:1px solid var(--zc-border);background:var(--zc-bg);margin-top:32px;}
#footer-inner{max-width:1100px;margin:0 auto;padding:32px 20px 20px;display:flex;flex-direction:column;gap:28px;}
.footer-brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:320px;}
.footer-logo-img{height:24px;width:auto;display:block;opacity:.85;}
.footer-logo-img-light{display:none;}
html[data-theme="light"] .footer-logo-img-dark{display:none;}
html[data-theme="light"] .footer-logo-img-light{display:block;}

.footer-tagline{font-size:13px;color:var(--zc-text-muted);line-height:1.6;margin:0;}
.footer-cols{display:flex;flex-wrap:wrap;gap:28px;}
.footer-col{display:flex;flex-direction:column;gap:10px;min-width:140px;}
.footer-col-title{font-size:12px;font-weight:800;color:var(--zc-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.footer-col a{color:var(--zc-text-secondary-2);text-decoration:none;font-size:15px;font-weight:600;cursor:pointer;transition:color .2s;}
.footer-col a:hover{color:#38bdf8;}
#footer-bottom{max-width:1100px;margin:0 auto;padding:0 20px calc(90px + env(safe-area-inset-bottom));font-size:12px;color:var(--zc-text-dim);}
#footer-legal{max-width:1100px;margin:0 auto;padding:0 20px 18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;border-top:1px solid var(--zc-border);padding-top:18px;}
#footer-company{font-size:12px;color:var(--zc-text-muted);line-height:1.6;}
#footer-company strong{color:var(--zc-text-secondary);}
#footer-sal{display:flex;flex-direction:column;align-items:center;justify-content:center;width:250px;height:50px;border-radius:8px;background:var(--zc-bg-panel);border:1px solid var(--zc-border);text-decoration:none;flex-shrink:0;transition:border-color .2s;}
#footer-sal:hover{border-color:#38bdf8;}
.sal-badge-txt{font-size:16px;font-weight:900;color:#38bdf8;letter-spacing:.05em;line-height:1.2;}
.sal-badge-sub{font-size:10px;color:var(--zc-text-secondary);line-height:1.2;text-align:center;padding:0 8px;}
@media (max-width:600px){
  #footer-legal{flex-direction:column;align-items:flex-start;}
}
@media(min-width:769px){
  #footer-inner{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:40px;}
  .footer-brand{flex:0 0 260px;}
  .footer-cols{flex:1;justify-content:flex-end;}
}
