<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow">
<title>Zoda — Ești offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#070b13;color:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .wrap{max-width:340px;}
  .icon{font-size:52px;margin-bottom:18px;}
  h1{font-size:20px;font-weight:800;margin-bottom:10px;}
  p{font-size:14px;color:#4d5f78;line-height:1.5;margin-bottom:22px;}
  button{
    background:linear-gradient(135deg,#0c3a4d,#0e7490);color:#e0f7ff;border:none;
    padding:12px 26px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>Ești offline</h1>
    <p>Nu avem conexiune la internet chiar acum. Reîncearcă atunci când semnalul revine — la baltă, semnalul mai vine și mai pleacă, știi cum e.</p>
    <button onclick="location.reload()">Reîncearcă</button>
  </div>
</body>
</html>
